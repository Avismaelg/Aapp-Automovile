<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invitación a Caravana</title>
<meta property="og:title" content="Te invitan a un convoy en Caravana">
<meta property="og:description" content="Toca para abrir la invitación en la app.">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #06080B; color: #F2F4F7;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: min(360px, calc(100% - 32px)); text-align: center; }
  .label { color: #8A94A6; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  h1 { font-size: 24px; margin: 8px 0 24px; }
  .code { font-size: 40px; font-weight: 800; letter-spacing: 8px; background: #11151B; border-radius: 16px; padding: 18px 0; }
  a.open, button { display: block; width: 100%; box-sizing: border-box; border: 0; border-radius: 999px; padding: 15px;
                   font-size: 16px; font-weight: 700; margin-top: 14px; text-decoration: none; cursor: pointer; }
  a.open { background: #F2F4F7; color: #06080B; }
  button { background: #1C222B; color: #F2F4F7; }
  p { color: #8A94A6; font-size: 14px; line-height: 1.5; margin-top: 22px; }
</style>
</head>
<body>
<main>
  <div class="label">Caravana</div>
  <h1>Te invitan a un convoy</h1>
  <div class="code" id="code">—</div>
  <a class="open" id="open" href="#">Abrir en Caravana</a>
  <button id="copy" type="button">Copiar código</button>
  <p>Si no se abre, entra en la app › Party › «Pegar invitación» o escribe el código.<br>
     ¿No tienes la app? Pídesela a quien te invitó.</p>
</main>
<script>
  var raw = new URLSearchParams(location.search).get('c') || '';
  var code = raw.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  document.getElementById('code').textContent = code || '—';
  var deep = 'caravana://party/' + code;
  var intent = 'intent://party/' + code + '#Intent;scheme=caravana;package=app.caravana.mobile;end';
  var open = document.getElementById('open');
  open.href = /Android/i.test(navigator.userAgent) ? intent : deep;
  document.getElementById('copy').onclick = function () {
    navigator.clipboard && navigator.clipboard.writeText(code);
    this.textContent = 'Copiado';
  };
  if (code) setTimeout(function () { location.href = open.href; }, 300);
</script>
</body>
</html>
