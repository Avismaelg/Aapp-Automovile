plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.caravana'
version = '1.0.0'

android {
  namespace "expo.modules.motion"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // La misma versión que ya trae expo-location.
  implementation 'com.google.android.gms:play-services-location:21.0.1'
}
