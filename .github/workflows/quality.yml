name: Calidad

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: movil/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx expo-doctor
      - run: npm test -- --coverage
      - run: npx expo export --platform web

  # Tipos de las Edge Functions (Deno). Se copian fuera de movil/: con su
  # package.json, Deno buscaría las dependencias npm en node_modules.
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check
        run: |
          cp -r movil/supabase/functions "$RUNNER_TEMP/functions"
          cd "$RUNNER_TEMP/functions"
          for f in */index.ts; do echo "== $f"; deno check "$f"; done
